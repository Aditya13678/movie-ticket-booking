<style>
  body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #E0E0E0;
  }

  .navbar {
      height: 10vh;
      background-color: #1F1F1F;
      display: flex;
      align-items: center;
      padding: 0 2rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      color: #E0E0E0;
  }

  .btn {
      background-color: #E50914;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
  }

  .btn:hover {
      background-color: #B00610;
  }

  .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 2rem;
  }

  .movie {
      height: 350px;
      width: 100%;
      border: 1px solid #2C2C2C;
      border-radius: 15px;
      background-color: #1E1E1E;
      transition: transform 0.2s, box-shadow 0.2s;
  }

  .movie:hover {
      box-shadow: 0 0 15px rgb(243, 241, 241);
      transform: scale(1.03);
      cursor: pointer;
  }

  .movie_title {
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 600;
      margin-top: 10px;
      color: #FFFFFF;
  }

  .movie_image {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 250px;
  }

  .movie_image img {
      max-height: 100%;
      max-width: 90%;
      border-radius: 10px;
      object-fit: cover;
  }

  .navbar-brand{
    color: #E0E0E0;
  }
  .nav-link{
    color: white;
  }
  
</style>







<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'home' %}">Book My Show</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="{% url 'home' %}">Home</a>
          </li>
          <li class="nav-item">

            <a class="nav-link" aria-current="page" href="{% url 'your_orders' %}">Your Orders</a>
          </li>
          
          
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>












<div class="container">

    
    {% for movie in movies %}
    <div class="movie">
        <br>
        <div class="movie_title">
            {{movie.title}}

        </div>
    <br>
    <div class="movie_image">
        <a href="{% url 'search' movie.slug %}">
            <img src="{{movie.image}}" alt="" height="200px" width="200px">
        </a>
    </div>
    <br>
    </div>

    
    {% endfor %}
    
    
   
</div>

    


{% endblock %}
